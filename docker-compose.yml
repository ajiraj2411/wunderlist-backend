version: "3.9"

services:
  mongo:
    image: mongo:6.0
    container_name: wunderlist-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: wunderlist_test

  app:
    build: .
    container_name: wunderlist-backend
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/wunderlist_test
    ports:
      - "8080:8080"
